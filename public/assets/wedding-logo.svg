<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Official Bengali Wedding Monogram Crest">
  <!-- Transparent-ready traditional Bengali lotus & shankha heritage wedding crest.
       Replace this file with your official wedding logo PNG/SVG at /public/assets/wedding-logo.svg (or update src/config/weddingAssets.ts). -->
  <defs>
    <linearGradient id="crestGold" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7C97B" />
      <stop offset="50%" stop-color="#B88A3B" />
      <stop offset="100%" stop-color="#8C6220" />
    </linearGradient>
    <linearGradient id="sindoorFill" x1="60" y1="50" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9252E" />
      <stop offset="100%" stop-color="#6F1018" />
    </linearGradient>
  </defs>

  <!-- Outer scalloped alpana wreath -->
  <circle cx="120" cy="120" r="106" stroke="url(#crestGold)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="120" cy="120" r="98" stroke="url(#crestGold)" stroke-width="1.5" />

  <!-- Eight auspicious lotus petals around ring -->
  <g stroke="url(#crestGold)" stroke-width="1.6" fill="#FBF7F0">
    <path d="M120 14 C126 26, 128 34, 120 42 C112 34, 114 26, 120 14 Z" />
    <path d="M120 226 C126 214, 128 206, 120 198 C112 206, 114 214, 120 226 Z" />
    <path d="M14 120 C26 114, 34 112, 42 120 C34 128, 26 126, 14 120 Z" />
    <path d="M226 120 C214 114, 206 112, 198 120 C206 128, 214 126, 226 120 Z" />
    <path d="M45 45 C58 48, 64 54, 66 66 C54 64, 48 58, 45 45 Z" />
    <path d="M195 45 C182 48, 176 54, 174 66 C186 64, 192 58, 195 45 Z" />
    <path d="M45 195 C58 192, 64 186, 66 174 C54 176, 48 182, 45 195 Z" />
    <path d="M195 195 C182 192, 176 186, 174 174 C186 176, 192 182, 195 195 Z" />
  </g>

  <!-- Central Sindoor Medallion -->
  <circle cx="120" cy="120" r="68" fill="url(#sindoorFill)" stroke="url(#crestGold)" stroke-width="2.5" />
  <circle cx="120" cy="120" r="60" stroke="#F6E5B6" stroke-width="1" stroke-opacity="0.7" />

  <!-- Topor Crown Motif -->
  <path d="M120 68 C124 76, 134 84, 136 92 L104 92 C106 84, 116 76, 120 68 Z" fill="#FBF7F0" stroke="url(#crestGold)" stroke-width="1.3" />
  <circle cx="120" cy="64" r="3" fill="#F6E5B6" />

  <!-- Intertwined Sacred Lotus Heart -->
  <path d="M120 98 C130 108, 136 120, 120 144 C104 120, 110 108, 120 98 Z" fill="#FBF7F0" stroke="url(#crestGold)" stroke-width="1.4" />
  <path d="M120 144 C102 135, 92 122, 95 107 C106 112, 114 123, 120 144 Z" fill="#F6E5B6" fill-opacity="0.9" stroke="url(#crestGold)" stroke-width="1.2" />
  <path d="M120 144 C138 135, 148 122, 145 107 C134 112, 126 123, 120 144 Z" fill="#F6E5B6" fill-opacity="0.9" stroke="url(#crestGold)" stroke-width="1.2" />

  <!-- Shankha / Twin Swasti Base Arc -->
  <path d="M90 154 C102 162, 138 162, 150 154" stroke="#F6E5B6" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="120" cy="166" r="3" fill="#F6E5B6" />
</svg>
